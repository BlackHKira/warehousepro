<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Codes - WarehousePro</title>
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #f5f5f5; padding: 24px; }
    h1 { text-align: center; margin-bottom: 8px; color: #333; font-size: 22px; }
    .subtitle { text-align: center; color: #888; margin-bottom: 24px; font-size: 13px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 16px; max-width: 1200px; margin: 0 auto; }
    .card { background: #fff; border: 1px solid #e0e0e0; border-radius: 10px; padding: 16px; text-align: center; page-break-inside: avoid; }
    .card:hover { box-shadow: 0 2px 12px rgba(0,0,0,0.1); }
    .qr { display: flex; justify-content: center; margin-bottom: 10px; }
    .name { font-weight: 600; font-size: 13px; color: #333; margin-bottom: 4px; }
    .barcode { font-family: monospace; font-size: 12px; color: #888; }
    .zone { display: inline-block; background: #e8f5e9; color: #2e7d32; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 4px; margin-bottom: 6px; }
    @media print {
      body { background: #fff; padding: 12px; }
      .card { border: 1px solid #ccc; break-inside: avoid; }
      .card:hover { box-shadow: none; }
    }
  </style>
</head>
<body>
  <h1>WarehousePro - QR Codes</h1>
  <p class="subtitle">In trang này hoặc hiển thị trên màn hình để quét thử trong app</p>
  <div class="grid" id="grid"></div>

  <script>
    const products = [
      { name: 'Coca Cola 355ml', barcode: '8934567890001', zone: 'A1' },
      { name: 'Pepsi 355ml', barcode: '8934567890002', zone: 'A1' },
      { name: 'Sting đỏ 330ml', barcode: '8934567890003', zone: 'A1' },
      { name: 'Number 1 355ml', barcode: '8934567890004', zone: 'A1' },
      { name: '7Up 355ml', barcode: '8934567890005', zone: 'A1' },
      { name: 'Sprite 355ml', barcode: '8934567890006', zone: 'A1' },
      { name: 'Fanta cam 355ml', barcode: '8934567890007', zone: 'A1' },
      { name: 'Mirinda Cream Soda 330ml', barcode: '8934567890008', zone: 'A1' },
      { name: 'Red Bull 250ml', barcode: '8934567890015', zone: 'B1' },
      { name: 'Monster 355ml', barcode: '8934567890016', zone: 'B1' },
      { name: 'Sting Vàng 250ml', barcode: '8934567890031', zone: 'B2' },
      { name: 'Cobra Strike 250ml', barcode: '8934567890032', zone: 'B2' },
      { name: 'Warrior 250ml', barcode: '8934567890033', zone: 'B2' },
      { name: 'Aquafina 500ml', barcode: '8934567890009', zone: 'C1' },
      { name: 'Lavie 500ml', barcode: '8934567890013', zone: 'C1' },
      { name: 'Dasani 500ml', barcode: '8934567890014', zone: 'C1' },
      { name: 'Imsong 500ml', barcode: '8934567890034', zone: 'C1' },
      { name: 'Vihawa 500ml', barcode: '8934567890035', zone: 'C1' },
      { name: 'Buddha 500ml', barcode: '8934567890036', zone: 'C1' },
      { name: 'Trà xanh C2 500ml', barcode: '8934567890010', zone: 'C2' },
      { name: 'Trà ô long T-Plus 500ml', barcode: '8934567890049', zone: 'C2' },
      { name: 'Trà xanh Không độ 500ml', barcode: '8934567890037', zone: 'C2' },
      { name: 'Trà sen Tây Hồ 500ml', barcode: '8934567890038', zone: 'C2' },
      { name: 'Trà nhài Ilsbean 500ml', barcode: '8934567890039', zone: 'C2' },
    ];

    const grid = document.getElementById('grid');

    products.forEach((p) => {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <div class="zone">${p.zone}</div>
        <div class="qr" id="qr-${p.barcode}"></div>
        <div class="name">${p.name}</div>
        <div class="barcode">${p.barcode}</div>
      `;
      grid.appendChild(card);

      new QRCode(document.getElementById(`qr-${p.barcode}`), {
        text: p.barcode,
        width: 120,
        height: 120,
        correctLevel: QRCode.CorrectLevel.M,
      });
    });
  </script>
</body>
</html>
